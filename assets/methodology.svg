<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="VenomIntel methodology: pick a target, choose an OSINT module, launch the tool, collect findings, then pivot — using public sources only.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%">
      <stop offset="0" stop-color="#1c0708"/><stop offset="55%" stop-color="#0c0304"/><stop offset="100%" stop-color="#050203"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff2d2d" stop-opacity="0"/><stop offset="0.5" stop-color="#ff5a5a"/><stop offset="1" stop-color="#ff2d2d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flowv" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ff2d2d" stop-opacity="0"/><stop offset="0.5" stop-color="#ff5a5a"/><stop offset="1" stop-color="#ff2d2d" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ff2d2d" stroke-opacity="0.055" stroke-width="1"/></pattern>
  </defs>
  <style>
    .t{fill:#f3e7e7}.m{fill:#bd8d8d}.r{fill:#ff4747}
    .title{font-size:13px;font-weight:700;letter-spacing:3px}
    .lbl{font-size:13px;font-weight:700}.sub{font-size:10px;letter-spacing:.3px}
    .tag{font-size:9.5px;font-weight:700;letter-spacing:1.5px}
    .mono{font-family:Consolas,monospace;font-size:11px}
    .flow{stroke:url(#flow);stroke-width:2.6;fill:none;stroke-dasharray:8 8;animation:dash 1s linear infinite}
    .flowv{stroke:url(#flowv);stroke-width:2.6;fill:none;stroke-dasharray:8 8;animation:dash 1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-16}}
    .rise{opacity:0;animation:rise .7s ease-out forwards}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .frame{stroke-dasharray:14 10;animation:fr 7s linear infinite}
    @keyframes fr{to{stroke-dashoffset:-48}}
    .scan{animation:scan 5.2s ease-in-out infinite}
    @keyframes scan{0%{transform:translateY(60px);opacity:0}8%{opacity:.5}52%{transform:translateY(380px);opacity:.5}60%{opacity:0}100%{opacity:0}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
    .blink{animation:blink 1.05s steps(1) infinite}
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
    .flick{animation:flick 3.2s ease-in-out infinite}
    @keyframes flick{0%,47%,100%{opacity:1}48%{opacity:.35}49%{opacity:1}91%{opacity:.55}92%{opacity:1}}
    .type{clip-path:inset(0 100% 0 0);animation:type 6s ease-in-out infinite}
    @keyframes type{0%,6%{clip-path:inset(0 100% 0 0)}46%{clip-path:inset(0 0 0 0)}92%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
  </style>

  <rect width="900" height="440" fill="url(#bg)"/>
  <rect width="900" height="440" fill="url(#grid)"/>
  <rect class="frame" x="7" y="7" width="886" height="426" rx="16" fill="none" stroke="#ff2d2d" stroke-opacity="0.5" stroke-width="1.4"/>
  <g class="scan"><rect x="9" y="0" width="882" height="2" fill="#ff3b3b" opacity="0.5" filter="url(#glow)"/></g>

  <text x="450" y="40" text-anchor="middle" class="title r flick" filter="url(#glow)">OSINT METHODOLOGY</text>

  <!-- Lifecycle nodes -->
  <g class="rise" style="animation-delay:0.00s">
    <rect x="30" y="74" width="140" height="74" rx="12" fill="#12080a" stroke="#ff2d2d" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="46" cy="92" r="3.2" class="r pulse" filter="url(#glow)"/>
    <text x="100" y="112" text-anchor="middle" class="lbl t">TARGET</text>
    <text x="100" y="132" text-anchor="middle" class="sub m">user · email · url</text>
  </g>
  <g class="rise" style="animation-delay:0.12s">
    <rect x="205" y="74" width="140" height="74" rx="12" fill="#12080a" stroke="#ff2d2d" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="221" cy="92" r="3.2" class="r pulse" filter="url(#glow)"/>
    <text x="275" y="112" text-anchor="middle" class="lbl t">SELECT</text>
    <text x="275" y="132" text-anchor="middle" class="sub m">osint module</text>
  </g>
  <g class="rise" style="animation-delay:0.24s">
    <rect x="380" y="74" width="140" height="74" rx="12" fill="#12080a" stroke="#ff2d2d" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="396" cy="92" r="3.2" class="r pulse" filter="url(#glow)"/>
    <text x="450" y="112" text-anchor="middle" class="lbl t">LAUNCH</text>
    <text x="450" y="132" text-anchor="middle" class="sub m">tool / web</text>
  </g>
  <g class="rise" style="animation-delay:0.36s">
    <rect x="555" y="74" width="140" height="74" rx="12" fill="#12080a" stroke="#ff2d2d" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="571" cy="92" r="3.2" class="r pulse" filter="url(#glow)"/>
    <text x="625" y="112" text-anchor="middle" class="lbl t">COLLECT</text>
    <text x="625" y="132" text-anchor="middle" class="sub m">accounts · meta</text>
  </g>
  <g class="rise" style="animation-delay:0.48s">
    <rect x="730" y="74" width="140" height="74" rx="12" fill="#12080a" stroke="#ff2d2d" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="746" cy="92" r="3.2" class="r pulse" filter="url(#glow)"/>
    <text x="800" y="112" text-anchor="middle" class="lbl t">PIVOT</text>
    <text x="800" y="132" text-anchor="middle" class="sub m">correlate</text>
  </g>

  <!-- Horizontal connectors -->
  <path class="flow" d="M170 111 H205"/>
  <path class="flow" d="M345 111 H380"/>
  <path class="flow" d="M520 111 H555"/>
  <path class="flow" d="M695 111 H730"/>
  <path d="M199 107 L205 111 L199 115 Z" class="r"/>
  <path d="M374 107 L380 111 L374 115 Z" class="r"/>
  <path d="M549 107 L555 111 L549 115 Z" class="r"/>
  <path d="M724 107 L730 111 L724 115 Z" class="r"/>

  <!-- Vertical connectors down to engine panel -->
  <path class="flowv" d="M275 148 V250"/>
  <path class="flowv" d="M625 148 V250"/>
  <path d="M271 244 L275 250 L279 244 Z" class="r"/>
  <path d="M621 244 L625 250 L629 244 Z" class="r"/>

  <!-- Engine panel -->
  <g class="rise" style="animation-delay:0.60s">
    <rect x="70" y="250" width="760" height="128" rx="14" fill="#0e0506" stroke="#ff2d2d" stroke-opacity="0.4" stroke-width="1.4"/>
    <text x="450" y="282" text-anchor="middle" class="lbl r" filter="url(#glow)">MODULES — one menu, many sources</text>

    <text x="100" y="318" class="tag r">TOOLS</text>
    <text x="185" y="318" class="mono t">sherlock · holehe · socialscan · blackbird · photon · spiderfoot · exiftool</text>

    <text x="100" y="350" class="tag r">SCOPE</text>
    <text x="185" y="350" class="mono t">username · email · web · image · metadata</text>
  </g>

  <!-- Footer command line -->
  <g transform="translate(70,410)">
    <rect x="-4" y="-14" width="18" height="18" rx="3" fill="none" stroke="#ff2d2d" stroke-opacity="0.5"/>
    <text x="0" y="0" class="mono r blink">&gt;</text>
    <text x="26" y="0" class="mono m type">target -&gt; enumerate -&gt; collect -&gt; pivot   ·   public sources only</text>
  </g>
</svg>
